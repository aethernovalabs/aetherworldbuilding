<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Aether Nova – World Building</title>
		<style>
			body {
				margin: 0;
				background: #0a0e17;
				color: #94a3b8;
				font-family: system-ui, sans-serif;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.loading {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				font-size: 0.9rem;
			}
			.spinner {
				width: 28px;
				height: 28px;
				border: 3px solid #232f48;
				border-top-color: #8b5cf6;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>

	<body>
		<div class="loading">
			<div class="spinner"></div>
			<span>Memuat Aether Nova…</span>
		</div>

		<script src="/js/dexie.min.js"></script>
		<script src="/js/aether-state.js"></script>
		<script>
			// Logika halaman awal (landing):
			// - Buka halaman yang terakhir dibuka oleh user (disimpan di IndexedDB)
			// - Belum pernah membuka halaman apa pun → buka halaman "buat projeck"
			//
			// Anti-loop: redirect dilakukan HANYA bila kita berada di path root "/".
			// Bila index.html diserve untuk path non-root lain (mis. mode
			// SPA-fallback), tidak redirect lagi → render menu fallback.
			var currentPath = (window.location.pathname || "/").replace(/\/+$/, "");
			if (currentPath === "" ) currentPath = "/";
			var isRoot = currentPath === "/";

			function renderFallbackMenu() {
				var links = [
					"buat-projeck", "dashboard", "dokumen", "element-dunia",
					"hubungan", "jaringan", "karakter", "linimasa", "peta-denah",
				];
				var menu = document.createElement("div");
				menu.style.cssText = "display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-top:1.25rem;";
				links.forEach(function (slug) {
					var a = document.createElement("a");
					a.href = "/" + slug;
					a.textContent = slug.replace("-", " ");
					a.style.cssText = "padding:0.4rem 0.9rem;border-radius:8px;background:#1d2840;color:#c4b5fd;text-decoration:none;font-size:0.8rem;";
					menu.appendChild(a);
				});
				document.querySelector(".loading").appendChild(menu);
			}

			function redirect(target) {
				if (!target || target === "/") { renderFallbackMenu(); return; }
				var targetPath = target.split("?")[0].replace(/\/+$/, "");
				if (targetPath === currentPath) { renderFallbackMenu(); return; }
				location.replace(target);
			}

			if (!isRoot) {
				renderFallbackMenu();
			} else {
				AetherState.getLastPage().then(function (lastPage) {
					redirect(lastPage || "/buat-projeck");
				});
			}
		</script>
	</body>
</html>
