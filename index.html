<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Aether Nova – World Building</title>
		<style>
			body {
				margin: 0;
				background: #0a0e17;
				color: #94a3b8;
				font-family: system-ui, sans-serif;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.loading {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				font-size: 0.9rem;
			}
			.spinner {
				width: 28px;
				height: 28px;
				border: 3px solid #232f48;
				border-top-color: #8b5cf6;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>

	<body>
		<div class="loading">
			<div class="spinner"></div>
			<span>Memuat Aether Nova…</span>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
		<script src="/js/aether-state.js"></script>
		<script>
			// Logika halaman awal (landing):
			// - Buka halaman yang terakhir dibuka oleh user (disimpan di IndexedDB)
			// - Belum pernah membuka halaman apa pun → buka halaman "buat projeck"
			AetherState.getLastPage().then(function (lastPage) {
				location.replace(lastPage || "/buat-projeck");
			});
		</script>
	</body>
</html>
