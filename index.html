<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Aether Nova – World Building</title>
		<style>
			body {
				margin: 0;
				background: #0a0e17;
				color: #94a3b8;
				font-family: system-ui, sans-serif;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.loading {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				font-size: 0.9rem;
			}
			.spinner {
				width: 28px;
				height: 28px;
				border: 3px solid #232f48;
				border-top-color: #8b5cf6;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>

	<body>
		<div class="loading">
			<div class="spinner"></div>
			<span>Memuat Aether Nova…</span>
		</div>

		<script>
			// Logika halaman pembuka (landing):
			// - Jika sudah ada projeck  → buka Dashboard (pages/dashboard.page.html)
			// - Jika belum ada projeck  → buka halaman Buat Projeck
			const STORAGE_KEY = "aether_projects";

			function getProjects() {
				try {
					const raw = localStorage.getItem(STORAGE_KEY);
					const list = raw ? JSON.parse(raw) : [];
					return Array.isArray(list) ? list : [];
				} catch {
					return [];
				}
			}

			function targetUrl() {
				const projects = getProjects();
				if (projects.length > 0) {
					const latest = projects[projects.length - 1];
					const world = latest && latest.name ? encodeURIComponent(latest.name) : "";
					return "/dashboard" + (world ? "?world=" + world : "");
				}
				return "/buat-projeck";
			}

			location.replace(targetUrl());
		</script>
	</body>
</html>
