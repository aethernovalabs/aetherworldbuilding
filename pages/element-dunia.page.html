      flex-direction: column;
      gap: 0.5rem;
    }

    .elem-group {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      overflow: hidden;
    }

    .elem-group-head {
      width: 100%;

    .elem-cards {

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;

    .elem-card {
      border: 1px solid var(--border);
