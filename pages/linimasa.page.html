<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linimasa – Aether Nova</title>
  <meta name="description" content="Garis waktu peristiwa-peristiwa dalam dunia world building.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="/styles/shared-workspace.css">
  <link rel="stylesheet" href="/styles/element-dunia.css">
  <link rel="stylesheet" href="/styles/element-dunia-detail.css">
  <link rel="stylesheet" href="/styles/linimasa.css">
  <script src="/js/dexie.min.js"></script>
  <script src="/js/aether-state.js"></script>
  <script src="/js/awb-page-utils.js"></script>
  <!-- Renderer formulir generik (image preview popup, tag chips, linked chips dengan dropdown) -->
  <script src="/js/element-dunia/form-renderer.js"></script>
</head>

<body>
  <div class="workspace-layout">
    <!-- SIDEBAR UTAMA AN WB -->
    <div class="awb-sidebar" id="awb-main-sidebar">
      <div class="awb-sb-header">
        <div class="awb-logo-collapsed">AN<br>WB</div>
        <div class="awb-logo-expanded">Aether Nova WB</div>
        <button class="awb-sb-expand-btn" id="btn-expand-main-sidebar" title="Perbesar Sidebar">&gt;</button>
        <div class="awb-world-wrap">
          <button class="awb-world-btn" id="btn-toggle-world-menu" title="World Manager">
            <iconify-icon icon="lucide:globe" width="15"></iconify-icon>
            <span class="world-label">World Manager</span>
          </button>
        </div>
      </div>
      <nav class="awb-sb-nav">
        <a class="awb-nav-link" href="dashboard.page.html" title="Dashboard">
          <span class="awb-nav-box"><iconify-icon icon="lucide:layout-dashboard" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Dashboard</span>
        </a>
        <a class="awb-nav-link" href="dokumen.page.html" title="Dokumen">
          <span class="awb-nav-box"><iconify-icon icon="lucide:book-open" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Dokumen</span>
        </a>
        <a class="awb-nav-link" href="karakter.page.html" title="Karakter">
          <span class="awb-nav-box"><iconify-icon icon="lucide:users" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Karakter</span>
        </a>
        <a class="awb-nav-link" href="element-dunia.page.html" title="Element Dunia">
          <span class="awb-nav-box"><iconify-icon icon="lucide:gem" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Element Dunia</span>
        </a>
        <a class="awb-nav-link active" title="Linimasa">
          <span class="awb-nav-box"><iconify-icon icon="lucide:calendar-range" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Linimasa</span>
        </a>
        <a class="awb-nav-link" href="graph.page.html" title="Graph">
          <span class="awb-nav-box"><iconify-icon icon="lucide:network" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Graph</span>
        </a>
        <a class="awb-nav-link" href="peta-denah.page.html" title="Visual Peta">
          <span class="awb-nav-box"><iconify-icon icon="lucide:map" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Visual Peta</span>
        </a>
        <div class="awb-sb-spacer"></div>
        <a class="awb-nav-link" href="#" title="Pencarian">
          <span class="awb-nav-box"><iconify-icon icon="lucide:search" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Pencarian</span>
        </a>
        <a class="awb-nav-link" href="#" title="Akun">
          <span class="awb-nav-box"><iconify-icon icon="lucide:circle-user-round" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Akun</span>
        </a>
        <a class="awb-nav-link" href="#" id="btn-open-settings" title="Setting">
          <span class="awb-nav-box"><iconify-icon icon="lucide:settings-2" width="16"></iconify-icon></span>
          <span class="awb-nav-text">Setting</span>
        </a>
      </nav>
      <div class="awb-sb-footer">
        <button class="awb-bottom-rail-expand" id="btn-bottom-expand" title="Perbesar Sidebar">&gt;</button>
        <button class="awb-sb-collapse-btn" id="btn-collapse-main-sidebar" title="Perkecil Sidebar">&lt;</button>
      </div>
    </div>
    <div class="workspace-content">
      <div class="page-header">
        <div>
          <h1><iconify-icon icon="lucide:calendar-range"></iconify-icon> Linimasa</h1>
          <p>Garis waktu peristiwa dalam dunia Aether Nova</p>
        </div>
        <div class="page-actions">
          <button class="btn-action primary" onclick="window.openPeristiwaModal()"><iconify-icon
              icon="lucide:plus"></iconify-icon> Tambah Peristiwa</button>
        </div>
      </div>
      <div class="timeline-toolbar" style="flex-direction:column;align-items:stretch;gap:0.6rem;">
        <div style="display:flex;align-items:center;gap:0.6rem;">
          <div class="search-wrap" style="max-width:300px;flex:1;">
            <iconify-icon icon="lucide:search"></iconify-icon>
            <input type="text" class="search-field" id="timeline-search" placeholder="Cari peristiwa...">
          </div>
          <select class="form-input" id="timeline-type-filter" style="max-width:220px;" title="Filter type peristiwa">
            <option>Semua Type</option>
            <option>Perang</option>
            <option>Bencana</option>
            <option>Penemuan</option>
            <option>Politik</option>
            <option>Budaya</option>
            <option>Institusi</option>
            <option>Kelahiran</option>
            <option>Lainnya</option>
          </select>
          <div class="view-toggle" style="margin-left:auto;">
            <button class="view-btn active" data-view="list" title="Daftar"><iconify-icon icon="lucide:list"
                width="16"></iconify-icon></button>
            <button class="view-btn" data-view="grid" title="Grid"><iconify-icon icon="lucide:layout-grid"
                width="16"></iconify-icon></button>
          </div>
        </div>
        <div id="timeline-tag-filter"
          style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap;">
        </div>
      </div>
      <div class="timeline-content" id="timeline-content">
        <!-- Diisi secara dinamis oleh renderTimeline() dari data IndexedDB -->
      </div>

      <!-- Sidebar kanan info peristiwa (pola visual sama dengan info element dunia) -->
      <aside class="elem-detail" id="event-detail-panel" aria-hidden="true">
        <div class="elem-detail-head">
          <span class="elem-detail-thumb"></span>
          <div class="elem-detail-info">
            <div class="elem-detail-name">Peristiwa</div>
            <div class="elem-detail-sub"></div>
          </div>
          <div class="elem-detail-buttons">
            <button class="win-btn" type="button" title="Tutup (Esc)" data-detail-close>
              <iconify-icon icon="lucide:x" width="16"></iconify-icon>
            </button>
            <button class="win-btn" type="button" title="Edit" data-detail-edit>
              <iconify-icon icon="lucide:pen-line" width="16"></iconify-icon>
            </button>
            <button class="win-btn" type="button" title="Hapus" data-detail-delete>
              <iconify-icon icon="lucide:trash-2" width="16"></iconify-icon>
            </button>
          </div>
        </div>
        <div class="elem-detail-body">
          <div class="elem-detail-header-content">
            <div class="elem-desc-box" data-detail-desc></div>
          </div>
          <div class="elem-detail-sections" data-detail-sections></div>
        </div>
      </aside>
    </div>
  </div>
  <div class="modal-overlay" id="modal-peristiwa">
    <div class="modal-frame" style="max-width:640px;">
      <div class="modal-header">
        <h3 id="modal-peristiwa-title" style="display:flex;align-items:center;gap:0.5rem;"><span
            style="width:32px;height:32px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;"><iconify-icon
              icon="lucide:calendar-range" width="16"></iconify-icon></span>Tambah Peristiwa</h3>
        <div style="display:flex;gap:0.5rem;"><button class="btn-cancel"
            onclick="window.closePeristiwaModal()">Batal</button><button class="btn-confirm"
            onclick="window.savePeristiwa()">Simpan</button></div>
      </div>
      <div class="modal-body" id="modal-peristiwa-body">
        <!-- Konten formulir diisi oleh AwbFormRenderer saat openPeristiwaModal() -->
      </div>
    </div>
  </div>

  <!-- Image Preview Popup (mirip pola di halaman Element Dunia) -->
  <div class="cf-pop" id="pop-peristiwa-img">
    <div class="cf-pop-box">
      <div class="cf-pop-head">
        <span><iconify-icon icon="lucide:image" width="16"></iconify-icon> Edit Gambar</span>
        <button class="win-btn" id="btn-tutup-pop-img-peristiwa"><iconify-icon icon="lucide:x"></iconify-icon></button>
      </div>
      <div class="cf-pop-body">
        <div id="elem-pop-img-preview-peristiwa" class="cf-img-pop-preview">Masukkan URL gambar untuk melihat pratinjau
        </div>
        <div>
          <label class="form-label">URL Image</label>
          <input type="text" class="form-input" id="pop-peristiwa-img-url" placeholder="https://...">
        </div>
      </div>
      <div class="cf-pop-foot">
        <button class="btn-cancel" id="btn-batal-pop-img-peristiwa">Batal</button>
        <button class="btn-confirm" id="btn-simpan-pop-img-peristiwa">Simpan</button>
      </div>
    </div>
  </div>

  <script src="/js/awb-sidebar.js"></script>
  <script src="/js/linimasa.js"></script>
  <script src="/js/linimasa-detail.js"></script>
</body>

</html>
